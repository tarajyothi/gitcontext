name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: gitcontext, POSTGRES_PASSWORD: gitcontext, POSTGRES_DB: gitcontext_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gitcontext" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    env:
      SKIP_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app --select E,F,W,B,S --ignore E501,S101,S603,S607,E702,B008,S311
      - name: Security scan (code)
        run: bandit -q -r app -ll
      - name: Dependency audit (known vulnerabilities)
        run: pip-audit -r requirements.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Migrations match the models (PostgreSQL)
        env: {DATABASE_URL: "postgresql+psycopg://gitcontext:gitcontext@localhost:5432/gitcontext_test"}
        run: alembic upgrade head && alembic check
      - name: Tests (PostgreSQL)
        env: {TEST_DATABASE_URL: "postgresql+psycopg://gitcontext:gitcontext@localhost:5432/gitcontext_test"}
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - name: Dependency audit (runtime deps)
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run build
