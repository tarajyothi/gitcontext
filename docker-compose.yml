# Local PostgreSQL for development (SQLite is the default). Set DATABASE_URL=postgresql+psycopg://gitcontext:gitcontext@localhost:5432/gitcontext
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gitcontext
      POSTGRES_PASSWORD: gitcontext
      POSTGRES_DB: gitcontext
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
