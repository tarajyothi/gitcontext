<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui,Segoe UI,sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker>
<style>.b{fill:#0f172a;stroke:#334155;stroke-width:1.5;rx:10}.g{fill:#064e3b;stroke:#059669;stroke-width:1.5;rx:10}.y{fill:#451a03;stroke:#d97706;stroke-width:1.5;rx:10}.t{fill:#f1f5f9;font-size:15px;font-weight:600}.s{fill:#94a3b8;font-size:12.5px}.h{fill:#34d399;font-size:13px;font-weight:700;letter-spacing:.06em}.l{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="720" fill="#020617"/>
<text x="30" y="38" class="t" style="font-size:22px">GitContext architecture</text>
<text x="30" y="60" class="s">Evidence-grounded Q&amp;A over any public GitHub repository. Green = verified end to end locally over HTTPS. Orange = safety control.</text>
<text x="30" y="98" class="h">REQUEST PATH</text>
<rect class="b" x="30" y="110" width="170" height="62"/><text x="45" y="136" class="t">Browser</text><text x="45" y="156" class="s">Next.js 16 / React 19 UI</text>
<rect class="g" x="260" y="110" width="190" height="62"/><text x="275" y="136" class="t">Caddy (HTTPS)</text><text x="275" y="156" class="s">/api/* to API, rest to UI</text>
<rect class="b" x="510" y="110" width="190" height="62"/><text x="525" y="136" class="t">Next.js server</text><text x="525" y="156" class="s">proxy.ts: session gate, CSP</text>
<rect class="g" x="760" y="110" width="210" height="62"/><text x="775" y="136" class="t">FastAPI (1 worker)</text><text x="775" y="156" class="s">auth, ownership, rate limits</text>
<rect class="g" x="1010" y="110" width="160" height="62"/><text x="1025" y="136" class="t">PostgreSQL 16</text><text x="1025" y="156" class="s">Alembic migrations</text>
<path class="l" d="M200,141 L258,141"/><path class="l" d="M450,141 L508,141"/><path class="l" d="M450,160 Q605,215 758,160"/><path class="l" d="M970,141 L1008,141"/>
<text x="30" y="226" class="h">INDEXING PIPELINE (background job, states: pending - indexing - ready | failed)</text>
<rect class="b" x="30" y="240" width="150" height="76"/><text x="44" y="266" class="t">GitHub</text><text x="44" y="286" class="s">shallow git clone</text><text x="44" y="302" class="s">https only, no hooks</text>
<rect class="b" x="215" y="240" width="170" height="76"/><text x="229" y="266" class="t">Scanner</text><text x="229" y="286" class="s">ignore binaries, secrets,</text><text x="229" y="302" class="s">symlinks; size caps</text>
<rect class="y" x="420" y="240" width="170" height="76"/><text x="434" y="266" class="t">Hash diff</text><text x="434" y="286" class="s">new, changed, removed,</text><text x="434" y="302" class="s">unchanged files</text>
<rect class="b" x="625" y="240" width="170" height="76"/><text x="639" y="266" class="t">Chunker</text><text x="639" y="286" class="s">AST (Python), JS/TS, MD,</text><text x="639" y="302" class="s">exact line ranges</text>
<rect class="y" x="830" y="240" width="150" height="76"/><text x="844" y="266" class="t">Secret masking</text><text x="844" y="286" class="s">keys and tokens</text><text x="844" y="302" class="s">replaced pre-index</text>
<rect class="b" x="1015" y="240" width="155" height="76"/><text x="1029" y="266" class="t">Embeddings</text><text x="1029" y="286" class="s">hashing baseline or</text><text x="1029" y="302" class="s">OpenAI-compatible</text>
<path class="l" d="M180,278 L213,278"/><path class="l" d="M385,278 L418,278"/><path class="l" d="M590,278 L623,278"/><path class="l" d="M795,278 L828,278"/><path class="l" d="M980,278 L1013,278"/>
<path class="l" d="M1092,238 L1092,175"/><text x="1000" y="206" class="s" text-anchor="end">chunks + vectors stored</text><text x="1000" y="222" class="s" text-anchor="end">(changed files only)</text>
<text x="30" y="420" class="h">QUESTION ANSWERING</text>
<rect class="b" x="30" y="434" width="140" height="84"/><text x="44" y="460" class="t">Question</text><text x="44" y="480" class="s">per-user rate limit,</text><text x="44" y="496" class="s">daily plan quota</text>
<rect class="g" x="200" y="434" width="230" height="84"/><text x="214" y="460" class="t">Hybrid retrieval</text><text x="214" y="480" class="s">vector + BM25 + exact identifier</text><text x="214" y="496" class="s">RRF, dedupe, filters, rerank</text>
<rect class="y" x="460" y="434" width="170" height="84"/><text x="474" y="460" class="t">Evidence gate</text><text x="474" y="480" class="s">terms found in the code?</text><text x="474" y="496" class="s">no: refuse, call nothing</text>
<rect class="b" x="660" y="434" width="190" height="84"/><text x="674" y="460" class="t">Generator</text><text x="674" y="480" class="s">extractive (default) or LLM</text><text x="674" y="496" class="s">repo text escaped, untrusted</text>
<rect class="y" x="880" y="434" width="150" height="84"/><text x="894" y="460" class="t">Verifier</text><text x="894" y="480" class="s">citations, lines,</text><text x="894" y="496" class="s">identifiers must exist</text>
<rect class="g" x="1060" y="434" width="110" height="84"/><text x="1072" y="460" class="t">Answer</text><text x="1072" y="480" class="s">file:line</text><text x="1072" y="496" class="s">citations</text>
<path class="l" d="M170,476 L198,476"/><path class="l" d="M430,476 L458,476"/><path class="l" d="M630,476 L658,476"/><path class="l" d="M850,476 L878,476"/><path class="l" d="M1030,476 L1058,476"/>
<text x="30" y="568" class="h">CROSS-CUTTING</text>
<rect class="b" x="30" y="582" width="270" height="100"/><text x="44" y="608" class="t">Tenancy and auth</text><text x="44" y="630" class="s">User - Workspace - Repository</text><text x="44" y="648" class="s">foreign ids return 404; scrypt;</text><text x="44" y="666" class="s">hashed server-side sessions</text>
<rect class="b" x="320" y="582" width="270" height="100"/><text x="334" y="608" class="t">Plans and usage</text><text x="334" y="630" class="s">free / pro / team limits, no billing</text><text x="334" y="648" class="s">questions, storage, LLM tokens</text><text x="334" y="666" class="s">counted per workspace</text>
<rect class="b" x="610" y="582" width="270" height="100"/><text x="624" y="608" class="t">Reliability</text><text x="624" y="630" class="s">/health, /ready, JSON logs, request ids</text><text x="624" y="648" class="s">clone retries, DB statement timeout,</text><text x="624" y="666" class="s">crash recovery of interrupted jobs</text>
<rect class="b" x="900" y="582" width="270" height="100"/><text x="914" y="608" class="t">Quality gates</text><text x="914" y="630" class="s">159 tests, ruff, bandit, pip-audit,</text><text x="914" y="648" class="s">npm audit, frozen benchmarks,</text><text x="914" y="666" class="s">22-step real-browser E2E</text>
</svg>
